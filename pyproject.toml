[project]
name = "happybd-automatization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "openpyxl",
    "python-dotenv",
    "jinja2",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["."]
timeout = 10
timeout_method = "signal"
